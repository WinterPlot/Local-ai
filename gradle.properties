org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.native.buildOutput=verbose

# Minimum Android API level. 33 matches the llama.cpp Android example this
# project's native build is derived from (the only configuration verified
# upstream). Lower values may work but are not verified, see docs/BUILD.md.
localai.minSdk=33
