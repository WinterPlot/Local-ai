name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install NDK and CMake
        run: SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1); (yes | $SDKM --licenses > /dev/null || true); $SDKM --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify native libraries are inside the APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|x86_64)/libllama\.so" || { echo "libllama.so missing"; exit 1; }
          unzip -l "$APK" | grep -E "lib/arm64-v8a/liblocalai-native\.so" || { echo "liblocalai-native.so missing"; exit 1; }

      - name: Build summary
        if: always()
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          {
            echo "## LocalAI build"
            echo "- Status: ${{ job.status }}"
            if [ -n "$APK" ]; then
              echo "- APK: $(basename "$APK") ($(du -h "$APK" | cut -f1))"
              echo "- ABIs: $(unzip -l "$APK" | grep -oE 'lib/[^/]+/' | sort -u | tr '\n' ' ')"
            fi
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
